spring.application.name=FitnessTracker

# DataBase Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/PracticeFitness
spring.datasource.username=${DB_URL}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialact=org.hibernate.dialect.MySQLDialect


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
